# rover-intent shared config. Arm-specific settings (URDF, joints, home, limits, workspace, table, objects, Isaac
# actuators) live in configs/arms/<arm_profile>.yaml and are merged over this file by rover_intent.config.load_config.
# Override the profile with the ROVER_ARM environment variable. PLACEHOLDER values are marked.

arm_profile: dev_arm          # dev_arm (the 2023 arm, the real hardware) | rover2026

safety:
  watchdog_s: 0.25

loop:
  hz: 50
  backend: mock                        # mock | isaac | real

net:                                   # laptop -> VM over the tailnet
  listen_port: 47100
  isaac_host: 127.0.0.1
  isaac_cmd_port: 47110
  isaac_state_port: 47111
  hud_port: 47130       # VM-screen overlay (scripts/hud.py): skeleton PiP, clutch, latency
  hud_video_port: 47131 # live webcam stream shown under the HUD (CameraFrame, forwarded by the app)

body:
  mode: plane           # body teleop mode. Two modes only:
                        #   plane = image-plane TCP teleop, depth ignored, IK path (body/plane.py) - the default;
                        #   arm_mirror = full-arm joint mirroring, no IK (body/arm_mirror.py) - the fallback.
                        # (The legacy position / calibrated / gesture modes were removed.)
  clutch: {calib_s: 2.0, still_m: 0.03, palm_s: 1.0, raise_m: 0.05}  # F / open palm held up 1 s / left hand up
  grip_from_hand: true  # fist closes the gripper; stand-in until EEG is live

# Full-arm joint mirroring (body.mode = arm_mirror). Defaults here; dev_arm_real.yaml tunes neutral/gain/sign.
# q_joint = clip(home + sign * gain * (raw_arm_angle - neutral), joint_limits). neutral is the raw arm angle (rad)
# that maps to the base pose. See src/rover_intent/body/arm_mirror.py and docs/ARM_MIRROR.md.
arm_mirror:
  side: right
  neutral: {az: -0.925, el: -0.419, elbow: 1.641, wrist: 0.0}   # rad; -53 -24 94 0 deg (Pranav 2026-10-23 medians)
  gain:    {j1: 1.0, j2: 1.0, j3: 0.8, j5: 0.8}                 # rad robot per rad human
  sign:    {j1: 1.0, j2: 1.0, j3: 1.0, j5: 1.0}
  one_euro: {min_cutoff: 1.0, beta: 0.05}   # on the JOINT angles: steadier than the TCP filter (tuned on replay)
  deadband_deg: 1.5          # hold a joint until its target drifts this far (cuts micro-jitter when still)
  j1_hold_vert_deg: 20.0     # hold J1 (base yaw) when the upper arm is within this of vertical (azimuth undefined)
  ramp_s: 2.0                # on engage, ease from the current pose to the mirrored pose over this long (no jump)
  conf_gate: true            # skip a pose that is not visible (the arm holds)

# Image-plane TCP teleop (body.mode = plane). Defaults here; dev_arm_real.yaml tunes gain/sign. Every control is
# read from IMAGE-plane landmarks (x, y) only, normalized by shoulder width, so depth (MediaPipe z, the noisy axis)
# is never used. target = tcp0 + ramp * gain * (hand - hand0). gains are metres of TCP per shoulder-width of hand
# motion. See src/rover_intent/body/plane.py and docs/PLANE_TELEOP.md.
plane:
  side: right                # the operator's CONTROL hand (lateral + vertical); the other hand drives reach
  gain:    {lateral: 0.20, vertical: 0.15, reach: 0.15}  # m of TCP per shoulder-width (y, z, x)
  sign:    {lateral: 1.0, vertical: 1.0, reach: 1.0}     # flip one if a control drives the wrong way (or press M)
  one_euro: {min_cutoff: 1.0, beta: 0.05}   # on the NORMALIZED hand coords
  deadband: 0.015            # shoulder-widths: hold a coord until it drifts this far (cuts micro-jitter when still)
  ramp_s: 2.0                # on engage, ease the gain in from 0 over this long (no jump)
  drop_below_hip_s: 0.7      # control wrist below the hip line this long -> "right arm dropped" -> on_drop preset
  conf_gate: true            # skip a pose that is not visible (the TCP holds)
  # reach_mode: "rate" = JOYSTICK reach from the reach-hand height (forward above ~shoulder, back below ~mid torso,
  # dead zone holds); "position" = the old height->x position map (reach gain applies). dev_arm_real defaults to rate.
  reach_mode: position       # default.yaml keeps the old position map; dev_arm_real.yaml selects rate.
  reach_rate:                # thresholds are fractions of the shoulder->hip torso span, body-absolute (not engage-rel)
    forward_frac: 0.10       # below the shoulders where FORWARD begins (~shoulder height)
    back_frac: 0.45          # below the shoulders where BACK begins (~lower chest / mid torso)
    max_speed: 0.04          # m/s cap on reach speed (well inside the real arm's limits)
    full_scale: 0.5          # shoulder-widths past a threshold at which max_speed is reached
    hysteresis: 0.08         # shoulder-widths of hysteresis at each threshold (anti-chatter)

nemotron:
  base_url: https://api.tokenfactory.nebius.com/v1/
  api_key_env: NEBIUS_API_KEY
  # Model is switchable here. 2026-10-23 benchmark on 20 tonight-style cloud utterances (median/p90 latency, action
  # accuracy on the Nebius Token Factory endpoint; full table in docs/VOICE.md):
  #   nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B   median 4.48 s  p90 10.18 s  18/20   (previous default)
  #   nvidia/Nemotron-3_5-Lightning           median 4.78 s  p90 14.68 s  19/20
  #   Qwen/Qwen3-30B-A3B-Instruct-2507        median 0.37 s  p90  7.63 s  19/20   <- set as default
  # Qwen3-30B-A3B is ~12x faster at the median with equal-or-better accuracy, BUT this is the Nebius x NVIDIA
  # hackathon: Pranav keeps Nemotron as the default (2026-10-24). Most commands never reach the cloud anyway
  # (instant local fast path). For a faster practice run: model: Qwen/Qwen3-30B-A3B-Instruct-2507
  model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
  timeout_s: 12.0  # client timeout for the cloud call (Nemotron p90 was ~10 s on 2026-10-23); on timeout the app
                   # says "Sorry, I didn't catch that in time"

real_arm:        # the button panel's HOME button (control/presets.py); off unless a real arm is attached
  enabled: false
  # Rowan's stepper_arm_driver home-all (cmd_type 'H' = 72, value 0xAA = all axes except the gripper)
  home_cmd: "source /opt/ros/jazzy/setup.bash && source ~/projects/ubc-rover-arm/RoverFlake2/install/setup.bash && ros2 topic pub --once /arm/command rover_msgs/msg/ArmCommand '{cmd_type: 72, cmd_value: 170}'"
  busy_s: 120    # presets refused for this long after a home; then the sim resets to arm.home

confirm:          # voice safety: the app asks "say yes to confirm" before a move; stop words always bypass this
  window_s: 5.0   # seconds to say yes/confirm/ok after the prompt; anything else or a timeout cancels
  skills: false   # also require confirm for the autonomous pick/place/move voice skills. Off here so the sim gate
                  # (scripts/gate.sh, dev_arm) keeps scripting skills without a yes; dev_arm_real turns it on.
  presets: true   # named poses (stow/ready/return/home) ask "say yes" first. dev_arm_real sets this false ("just
                  # push it", Pranav 2026-10-23: the 2-step confirm was too slow on the real mic).
  motion: true    # the no-camera voice jogs (Cartesian jog / joint jog / "then" sequence / speed) ask first too;
                  # dev_arm_real sets this false. STOP is always instant and bypasses every confirm.

eeg:
  p_on: 0.7      # p_grasp above this -> close (after hold_s)
  p_off: 0.3     # below this -> open
  hold_s: 0.5

assist:
  radius: 0.08
  gain: 0.6
