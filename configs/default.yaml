# rover-intent default config. PLACEHOLDER values are marked; replace as hardware facts come in.

arm:
  urdf: assets/rover2026/rover2026_gripper.urdf
  tip_link: a6_EE_holder
  tcp_offset: [0.145, 0.0, 0.0]       # sim gripper pad centre (sim/make_gripper_urdf.py). PLACEHOLDER for the real claw
  home: [3.978, -1.285, 0.689, 0.0, 1.966, 2.305]  # sim: TCP top-down at (0.45, 0, 0.38), inside the reach box. PLACEHOLDER for the real arm
  # PLACEHOLDER motor limits (same as the v4 sim work) until the datasheets arrive
  max_vel: [0.8, 0.8, 0.8, 1.5, 1.5, 1.5]   # rad/s
  max_acc: [2.0, 2.0, 2.0, 4.0, 4.0, 4.0]   # rad/s^2

safety:
  # top-down-reachable box from home (measured 2026-09-29: IK from home, 1 cm / 5 deg); outside it the arm stalls
  workspace_min: [0.35, -0.40, 0.15]  # m, base frame; z floor = table top 0.12 + 0.03 (fingertips reach ~2 cm below the TCP)
  workspace_max: [0.80, 0.40, 0.45]
  watchdog_s: 0.25

loop:
  hz: 50
  backend: mock                        # mock | isaac | real

net:                                   # laptop -> VM over the tailnet
  listen_port: 47100
  isaac_host: 127.0.0.1
  isaac_cmd_port: 47110
  isaac_state_port: 47111
  hud_port: 47130       # VM-screen overlay (scripts/hud.py): skeleton PiP, clutch, latency

body:
  mode: position        # position = wrist-rel-shoulder -> gripper offset, 1:1 direction, clamped (default);
                        # gesture = swing/raise/reach -> yaw/height/reach (body/mirror.py)
  clutch: {calib_s: 2.0, still_m: 0.03, palm_s: 1.0, raise_m: 0.05}  # F / open palm held up 1 s / left hand up
  gesture_gains: [2.5, 1.0, 0.6]   # rad yaw per m sideways, m height per m up, m reach per unit elbow extension
  # MediaPipe world axes (x image-right, y down, z toward camera = smaller) -> arm base (x fwd, y left, z up).
  # Over-the-shoulder view: hand to YOUR right -> gripper right on screen. (Was [-1,0,0] for y: left/right inverted.)
  axes: [[0, 0, -1], [1, 0, 0], [0, -1, 0]]
  scale: [1.2, 1.4, 1.4]  # robot m per human m, per robot axis (fwd, lateral, up); monocular depth is the noisiest
  origin: [0.45, 0.0, 0.45]
  one_euro: {min_cutoff: 1.0, beta: 0.7}  # smooth when still, low lag when moving fast
  grip_from_hand: true  # fist closes the gripper; stand-in until EEG is live

nemotron:
  base_url: https://api.tokenfactory.nebius.com/v1/
  api_key_env: NEBIUS_API_KEY
  # 2026-09-28 on 7 test phrases: Nano 7/7, Super 5/7 (heard "whoa hold on" as grasp); 1.4-3.9 s per call
  model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B

eeg:
  p_on: 0.7      # p_grasp above this -> close (after hold_s)
  p_off: 0.3     # below this -> open
  hold_s: 0.5

assist:
  radius: 0.08
  gain: 0.6

table:  # static table in front of the arm (the arm stands on the floor, z = 0)
  top: 0.12                  # m; puts grasp points at 0.155-0.23 m, mid-band of the top-down reach (IK-checked)
  x: [0.32, 0.86]
  y: [-0.42, 0.42]

scene:  # pos = grasp point (TCP target) in the arm base frame; objects stand on the table top.
        # Layout checked with IK (tests/test_core.py::test_scene_is_reachable): grasp, pre-grasp, transit and every
        # "beside" drop-off are reachable top-down with margin. >= 0.15 m spacing so drop-offs don't collide.
  cup:    {pos: [0.50, 0.18, 0.175], height: 0.09, radius: 0.035, mass: 0.15, shape: cylinder, desc: "short red cup"}
  bottle: {pos: [0.50, -0.18, 0.305], height: 0.22, radius: 0.035, mass: 0.50, shape: cylinder, desc: "tall blue bottle"}
  block:  {pos: [0.64, 0.00, 0.155], height: 0.05, radius: 0.025, mass: 0.10, shape: box, desc: "small yellow cube"}
