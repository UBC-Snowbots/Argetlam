# MoveIt Servo params for the dev_arm, ported from Rowan's old-API file
# (RoverFlake2/src/dev_arm_moveit_config_v3/config/rover_servo_params_dev_arm.yaml) to the MoveIt 2.12 / Jazzy
# parameter schema (/opt/ros/jazzy/share/moveit_servo/config/servo_parameters.yaml). Loaded under the "moveit_servo"
# prefix by the launch file. Flat keys, like the stock panda_simulated_config.yaml.
#
# Dropped vs Rowan's file (not Jazzy params any more): use_gazebo, planning_frame, ee_frame_name,
# robot_link_command_frame, num_outgoing_halt_msgs_to_publish. In new Servo the planning frame and the EE frame come
# from the robot model / SRDF group; the twist command frame is the TwistStamped header.frame_id.

## Outgoing command rate
publish_period: 0.034        # Rowan 0.034 (~29 Hz). 1 / nominal publish rate [s]
max_expected_latency: 0.15   # Jazzy requires publish_period < max_expected_latency/3, so 0.1 rejects 0.034

## Incoming command units + scaling (Rowan's values kept)
command_in_type: "unitless"  # [-1:1] joystick-style; scale.* give the max speed at command = 1.0
scale:
  linear: 0.5                # max linear vel [m/s] at unitless 1.0 (Rowan)
  rotational: 1.2            # max angular vel [rad/s] at unitless 1.0 (Rowan)
  joint: 0.5                 # joint-jog scale (Rowan)

# Stop servoing if no new command arrives within this window -> the stop-on-stale behaviour. Rowan used 1.0 s;
# dropped to 0.1 s here so a halted command stream stops the arm promptly (and visibly in the demo).
incoming_command_timeout: 0.1

## Outgoing command
command_out_type: trajectory_msgs/JointTrajectory
command_out_topic: /arm_controller/joint_trajectory   # the team's JointTrajectoryController (ros2_controllers.yaml)
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false   # arm_controller takes only position; no need to publish accel

## Smoothing (Rowan's Butterworth)
use_smoothing: true
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

## Planning scene / state
is_primary_planning_scene_monitor: true   # Servo owns the scene; no move_group in this demo
monitored_planning_scene_topic: /planning_scene
joint_topic: /joint_states
move_group_name: arm                      # the SRDF planning group

## Twist behaviour
apply_twist_commands_about_ee_frame: true

## Collision checking OFF (Rowan: the dev_arm URDF link geometry overlaps at the home pose -> false positives)
check_collisions: false
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02

## Singularity handling. Rowan effectively disabled it (1000/5000); kept generous so the demo near the start pose
## is not halted by condition-number slowdown, while still finite.
lower_singularity_threshold: 30.0
hard_stop_singularity_threshold: 60.0
leaving_singularity_threshold_multiplier: 2.0
singularity_step_scale: 0.01

## Joint limiting (limits themselves come from the URDF; this is the safety buffer). Rowan joint_limit_margin 0.02.
halt_all_joints_in_joint_mode: true
halt_all_joints_in_cartesian_mode: true
joint_limit_margins: [0.02]
override_velocity_scaling_factor: 0.0
